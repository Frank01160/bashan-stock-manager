<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - Bashan Animal Feeds</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/pos.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <header class="header">
        <h1>🏪 Bashan Animal Feeds</h1>
        <div class="header-actions">
            <a href="report.html" class="btn btn-secondary">📋 Daily Report</a>
        </div>
    </header>

    <div class="pos-container">
        <!-- Left Panel - Products -->
        <div class="products-panel">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Search products..." class="form-control">
            </div>
            
            <div class="category-tabs" id="categoryTabs">
                <button class="category-tab active" data-category="all">All</button>
            </div>
            
            <div class="products-grid" id="productsGrid">
                <!-- Products will be loaded here -->
            </div>
        </div>
        
        <!-- Right Panel - Cart -->
        <div class="cart-panel">
            <h2>Current Sale</h2>
            <div class="cart-items" id="cartItems">
                <p class="empty-cart">No items in cart</p>
            </div>
            
            <div class="cart-summary" id="cartSummary" style="display: none;">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">KES 0.00</span>
                </div>
                <div class="summary-row">
                    <span>Discount (KES):</span>
                    <input type="number" id="discountInput" class="form-control" value="0" min="0">
                </div>
                <div class="summary-row total">
                    <span>TOTAL:</span>
                    <span id="total">KES 0.00</span>
                </div>
                
                <div class="payment-method">
                    <label>
                        <input type="radio" name="payment" value="cash" checked> 💵 Cash
                    </label>
                    <label>
                        <input type="radio" name="payment" value="mpesa"> 📱 M-Pesa
                    </label>
                </div>
                
                <button class="btn btn-primary btn-block" id="completeSaleBtn">
                    ✅ Complete Sale
                </button>
                <button class="btn btn-danger btn-block" id="clearCartBtn">
                    🗑️ Clear Cart
                </button>
            </div>
        </div>
    </div>

    <!-- Product Quantity Modal -->
    <div class="modal" id="quantityModal">
        <div class="modal-content">
            <h3 id="modalProductName"></h3>
            <p id="modalProductInfo"></p>
            <div class="form-group">
                <label>Quantity (<span id="modalUnit"></span>):</label>
                <input type="number" id="modalQuantity" class="form-control" min="0.1" step="0.1" value="1">
            </div>
            <button class="btn btn-primary" id="modalAddBtn">Add to Cart</button>
            <button class="btn btn-secondary" id="modalCancelBtn">Cancel</button>
        </div>
    </div>

    <!-- Receipt Modal -->
    <div class="modal" id="receiptModal">
        <div class="modal-content receipt-content">
            <div id="receiptContent"></div>
            <div class="receipt-actions">
                <button class="btn btn-primary" id="downloadReceiptBtn">📥 Download PDF</button>
                <button class="btn btn-secondary" id="printReceiptBtn">🖨️ Print Receipt</button>
                <button class="btn btn-success" id="newSaleBtn">➕ New Sale</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pos.js"></script>
</body>
</html>
